[terminal.shell]
program = "/opt/homebrew/bin/zsh"
args = ["--login"]

[window]
option_as_alt = 'Both'

[keyboard]
bindings = [
  # Defined here rather than the shared toml so each platform's local.toml
  # can bind Ctrl+Shift+V independently without the shared binding conflicting.
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "Enter", mods = "Shift", chars = "\x1b[13;2u" },
]
