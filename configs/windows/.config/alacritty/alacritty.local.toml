[terminal.shell]
program = "cmd.exe"
args = [
  "/c",
  """\
"cd %USERPROFILE% && \
  .config\\shortcuts\\msys2_shell.cmd \
    -ucrt64 \
    -defterm \
    -here \
    -no-start \
    -use-full-path \
    -shell \
    zsh --login"
  """
]

# ConPTY does not decode kitty CSI-u (it types "[13;2u" into Win32 TUIs).
# Do not inject win32-input-mode (`CSI ... _`) either. One `_` sequence
# latches ConPTY into W32IM for the rest of the PTY, after which a lone
# ESC is treated as a split sequence and never reaches the client.
# ESC+CR is Alt+Enter, which ConPTY already turns into a modified Return.
[keyboard]
bindings = [
  # conpty-paste.exe taps F24 for VT or line-mode apps, or injects
  # KEY_EVENTs directly for apps that read raw console input.
  { key = "F24",                   action  = "Paste" },
  { key = "V", mods = "Control|Shift", command = "conpty-paste.exe" },
  { key = "Enter", mods = "Shift", chars   = "\x1b\r" },
]
